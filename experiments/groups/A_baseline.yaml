group: "A"
name: "Baseline System Performance"
description: "Establishes canonical baseline latency, throughput, and resource utilization across standard load intensities with default settings."
defaults:
  checkout_replicas: 2
  db_pool_size: 50
  cpu_limit: "500m"
  cache_enabled: false
  consumers: 2
  seed: 42
  split: "train"
workload:
  profile: "normal"
  duration: 15
  warmup_duration: 2
matrix:
  rps: [50, 100, 200, 300, 400, 500]
