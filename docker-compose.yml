version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scopex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scopex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scopex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scopex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: scopex-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: scopex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: scopex-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboard:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  product:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-product
    command: ["uvicorn", "services.product.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PORT: "8001"
      CACHE_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  cart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-cart
    command: ["uvicorn", "services.cart.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      PORT: "8002"
      LOG_LEVEL: "INFO"
    ports:
      - "8002:8002"

  inventory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-inventory
    command: ["uvicorn", "services.inventory.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      PORT: "8003"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scopex"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      LOG_LEVEL: "INFO"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-payment
    command: ["uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      PORT: "8004"
      PAYMENT_LATENCY_MS: "50"
      PAYMENT_FAILURE_RATE: "0.0"
      LOG_LEVEL: "INFO"
    ports:
      - "8004:8004"

  order:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-order
    command: ["uvicorn", "services.order.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      PORT: "8005"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/scopex"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      ORDER_CONSUMER_CONCURRENCY: "1"
      ORDER_PROCESSING_DELAY_MS: "50"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      LOG_LEVEL: "INFO"
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  checkout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopex-checkout
    command: ["uvicorn", "services.checkout.main:app", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      PORT: "8006"
      CART_SERVICE_URL: "http://cart:8002"
      INVENTORY_SERVICE_URL: "http://inventory:8003"
      PAYMENT_SERVICE_URL: "http://payment:8004"
      ORDER_SERVICE_URL: "http://order:8005"
      LOG_LEVEL: "INFO"
    ports:
      - "8006:8006"
    depends_on:
      - cart
      - inventory
      - payment
      - order

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
