apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: scopex
  labels:
    app: cart
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cart
          image: scopex-cart:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.cart.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PORT
              value: "8002"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: scopex
  labels:
    app: cart
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: cart
