apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: scopex
  labels:
    app: payment
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment
          image: scopex-payment:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "8004"]
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: PORT
              value: "8004"
            - name: PAYMENT_LATENCY_MS
              value: "50"
            - name: PAYMENT_FAILURE_RATE
              value: "0.0"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: scopex
  labels:
    app: payment
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: payment

