apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: scopex
  labels:
    app: order
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: order
          image: scopex-order:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.order.main:app", "--host", "0.0.0.0", "--port", "8005"]
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: PORT
              value: "8005"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/scopex"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: ORDER_CONSUMER_CONCURRENCY
              value: "1"
            - name: ORDER_PROCESSING_DELAY_MS
              value: "50"
            - name: DB_POOL_SIZE
              value: "10"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: scopex
  labels:
    app: order
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  selector:
    app: order
