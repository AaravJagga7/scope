apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: scopex
  labels:
    app: inventory
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inventory
          image: scopex-inventory:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.inventory.main:app", "--host", "0.0.0.0", "--port", "8003"]
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: PORT
              value: "8003"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/scopex"
            - name: DB_POOL_SIZE
              value: "10"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: scopex
  labels:
    app: inventory
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      name: http
  selector:
    app: inventory

