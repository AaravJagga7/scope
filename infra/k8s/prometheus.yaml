apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: scopex
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
      - job_name: "product"
        static_configs:
          - targets: ["product:8001"]

      - job_name: "cart"
        static_configs:
          - targets: ["cart:8002"]

      - job_name: "inventory"
        static_configs:
          - targets: ["inventory:8003"]

      - job_name: "payment"
        static_configs:
          - targets: ["payment:8004"]

      - job_name: "order"
        static_configs:
          - targets: ["order:8005"]

      - job_name: "checkout"
        static_configs:
          - targets: ["checkout:8006"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: scopex
  labels:
    app: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: scopex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: scopex
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus

