apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cart
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: {{ .Values.cart.replicas }}
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.cart.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cart
          image: {{ .Values.cart.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn", "services.cart.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.cart.port }}"]
          ports:
            - containerPort: {{ .Values.cart.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.cart.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
          resources:
            {{- toYaml .Values.cart.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cart.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cart.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cart
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.cart.port }}
      targetPort: {{ .Values.cart.port }}
      name: http
  selector:
    app: cart
