apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: {{ .Values.global.namespace }}
  labels:
    app: product
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: {{ .Values.product.replicas }}
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.product.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: product
          image: {{ .Values.product.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn", "services.product.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.product.port }}"]
          ports:
            - containerPort: {{ .Values.product.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.product.port | quote }}
            - name: CACHE_ENABLED
              value: {{ .Values.product.cache_enabled | quote }}
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
          resources:
            {{- toYaml .Values.product.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.product.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.product.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: {{ .Values.global.namespace }}
  labels:
    app: product
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.product.port }}
      targetPort: {{ .Values.product.port }}
      name: http
  selector:
    app: product

