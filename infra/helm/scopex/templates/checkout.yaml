apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: {{ .Values.global.namespace }}
  labels:
    app: checkout
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: {{ .Values.checkout.replicas }}
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.checkout.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: checkout
          image: {{ .Values.checkout.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn", "services.checkout.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.checkout.port }}"]
          ports:
            - containerPort: {{ .Values.checkout.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.checkout.port | quote }}
            - name: CART_SERVICE_URL
              value: "http://cart:{{ .Values.cart.port }}"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:{{ .Values.inventory.port }}"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment:{{ .Values.payment.port }}"
            - name: ORDER_SERVICE_URL
              value: "http://order:{{ .Values.order.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.checkout.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.checkout.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: {{ .Values.global.namespace }}
  labels:
    app: checkout
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.checkout.port }}
      targetPort: {{ .Values.checkout.port }}
      name: http
  selector:
    app: checkout

