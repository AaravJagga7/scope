apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: scopex
spec:
  replicas: {{ .Values.payment.replicas }}
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        app.kubernetes.io/component: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.payment.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment
          image: {{ .Values.payment.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.payment.port }}"]
          ports:
            - containerPort: {{ .Values.payment.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.payment.port | quote }}
            - name: PAYMENT_LATENCY_MS
              value: {{ .Values.payment.latency_ms | quote }}
            - name: PAYMENT_FAILURE_RATE
              value: {{ .Values.payment.failure_rate | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
          resources:
            {{- toYaml .Values.payment.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.payment.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.payment.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.payment.port }}
      targetPort: {{ .Values.payment.port }}
      name: http
  selector:
    app: payment

