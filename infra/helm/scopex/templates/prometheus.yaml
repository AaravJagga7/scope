{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
      - job_name: "product"
        static_configs:
          - targets: ["product:{{ .Values.product.port }}"]

      - job_name: "cart"
        static_configs:
          - targets: ["cart:{{ .Values.cart.port }}"]

      - job_name: "inventory"
        static_configs:
          - targets: ["inventory:{{ .Values.inventory.port }}"]

      - job_name: "payment"
        static_configs:
          - targets: ["payment:{{ .Values.payment.port }}"]

      - job_name: "order"
        static_configs:
          - targets: ["order:{{ .Values.order.port }}"]

      - job_name: "checkout"
        static_configs:
          - targets: ["checkout:{{ .Values.checkout.port }}"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: scopex
spec:
  replicas: {{ .Values.prometheus.replicas }}
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: {{ .Values.prometheus.port }}
              name: http
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.prometheus.port }}
      targetPort: 9090
      name: http
  selector:
    app: prometheus
{{- end }}

